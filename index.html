<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Schreibschrift lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--mute:#6d6a78;--pri:#3b6fd4;--priink:#fff;--ok:#2e9e5b;--bad:#d9475a;--line:#e6dcc8;--gold:#f2a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c26;--card:#2a2936;--ink:#f1eef8;--mute:#a9a5bb;--pri:#7aa2f5;--priink:#14131b;--ok:#5fd08a;--bad:#ff7b8c;--line:#3d3b4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1c26;--card:#2a2936;--ink:#f1eef8;--mute:#a9a5bb;--pri:#7aa2f5;--priink:#14131b;--ok:#5fd08a;--bad:#ff7b8c;--line:#3d3b4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Andika',system-ui,sans-serif;font-size:18px;touch-action:manipulation}
button,.bar{-webkit-user-select:none;user-select:none}
main{max-width:920px;margin:0 auto;padding:12px 16px 24px}
.s{font-family:'EuroScript','Comic Sans MS',cursive;line-height:1.8}
.d{font-family:'Andika',sans-serif}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 14px;cursor:pointer;min-height:52px}
button:active{transform:scale(.96)}
button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.bar{display:flex;gap:10px;align-items:center}
.bar button{font-size:1.25rem;min-height:56px}
.bar .grow{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.panel{display:none}.panel.open{display:block}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.prow .pi{font-size:1.6rem;width:40px;text-align:center}
.prow button{font-size:1.5rem;min-width:84px}
.go{width:100%;font-size:1.3rem;background:var(--pri);color:var(--priink);border-color:var(--pri)}
.tr{text-align:center}.tr canvas{width:100%;max-width:880px;border:2px dashed var(--line);border-radius:16px;background:var(--bg);touch-action:none}.trs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}.trs .tr{flex:1 1 240px;max-width:380px}
.pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:9rem;pointer-events:none;animation:pop 1.4s ease-out forwards}@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.big{font-size:clamp(4rem,13vw,7rem);text-align:center;display:flex;align-items:center;justify-content:center;gap:clamp(20px,6vw,60px);min-height:9rem}
.big small{display:block;font-size:.8rem;color:var(--mute);font-family:'Andika',sans-serif;line-height:1}
.q{font-size:clamp(4.5rem,14vw,7.5rem);text-align:center;min-height:9rem;display:flex;align-items:center;justify-content:center}
.q.w{font-size:clamp(2.6rem,9vw,4.6rem);min-height:7rem;word-break:break-word}
input{font:inherit;font-size:2.2rem;width:110px;text-align:center;padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.wide{width:min(420px,70vw)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:10px}
.grid button{font-size:1.9rem;padding:0;min-height:68px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.opts button{font-size:clamp(2.4rem,8vw,3.6rem);padding:0;min-height:96px;line-height:1.6}
.pg{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}.pr{display:flex;gap:4px;padding:4px;border:2px solid var(--line);border-radius:18px;background:var(--bg)}.grid .pr button{flex:1;min-width:0;font-size:1.45rem;min-height:54px;padding:0}
.grid .pr button.u,.grid>button.u{padding:9px 9px 0 0}.grid .pr button.l,.grid>button.l{padding:0 3px 0 0}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{text-align:center;min-height:1.7em;margin-top:8px;font-weight:bold;font-size:1.15rem}
.row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.row button{font-size:1.3rem;min-width:120px}
.stats{display:flex;justify-content:center;gap:28px;font-size:1.3rem;margin-top:14px}
.pbar{height:26px;border-radius:13px;background:var(--line);overflow:hidden;margin-top:10px;position:relative}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.pbar b{position:absolute;inset:0;text-align:center;font-size:.9rem;line-height:26px;color:var(--ink)}
.lbl{color:var(--mute);font-size:.9rem;text-align:center;margin:6px 0}
.hint{color:var(--mute);font-size:.8rem;text-align:center;margin-top:14px}
@media (orientation:landscape) and (min-width:820px){
 main{max-width:1200px;padding-top:8px}
 .card{padding:12px 16px;margin-top:8px}
 .card:has(#inp),.card:has(#tc),.card:has(>.q){display:grid;column-gap:20px;align-items:start}
 .card:has(#inp),.card:has(#tc){grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
 .card:has(>.q){grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
 .card:has(>.q.w){grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
 .card:has(>.pg){grid-template-columns:270px minmax(0,1fr)}
 .card:has(>.pg)>.stats{gap:12px;font-size:1.1rem;flex-wrap:wrap}
 .card:has(#inp)>*,.card:has(#tc)>*,.card:has(>.q)>*{grid-column:1}
 .card:has(#inp)>.grid,.card:has(#tc)>.grid,.card:has(>.q)>.grid,.card:has(>.q)>.opts{grid-column:2;grid-row:1/span 6;margin-top:0}
 .card:has(#inp)>.grid,.card:has(#tc)>.grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
 .card:has(#inp)>.grid button,.card:has(#tc)>.grid button{min-height:56px;font-size:1.5rem}
 .q{min-height:6.5rem;font-size:clamp(4rem,9vw,6rem)}
 .q.w{min-height:5rem;font-size:clamp(2.4rem,6vw,4rem)}
 .card:has(>.q)>.opts button{min-height:110px}
 .card:has(>.q.w)>.opts{grid-template-columns:repeat(2,1fr)}
}
</style>

function trInit(){document.querySelectorAll("canvas[data-t]").forEach(cv=>{
 const t=cv.dataset.t,W=cv.width,H=cv.height,g=cv.getContext("2d");
 const mk=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c};
 const ink=mk(),ig=ink.getContext("2d");let fs=H*.7;
 const draw=(c,tol)=>{fs=H*.7;const f=z=>c.font=z+'px "EuroScript",cursive';f(fs);const w=c.measureText(t).width;if(w>W*.9){fs*=W*.9/w;f(fs)}c.textAlign="center";const m=c.measureText(t);const y=H/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;if(tol){c.lineWidth=fs*.22;c.lineJoin="round";c.strokeText(t,W/2,y)}c.fillText(t,W/2,y)};
 const paint=()=>{g.clearRect(0,0,W,H);g.fillStyle="rgba(130,130,150,.3)";draw(g);g.drawImage(ink,0,0)};
 const seg=(a,b,c,d)=>{ig.strokeStyle="#3b6fd4";ig.lineWidth=fs*.11;ig.lineCap="round";ig.beginPath();ig.moveTo(a,b);ig.lineTo(c,d);ig.stroke();paint()};
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 let on=false,lx,ly;
 cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pt(e);seg(lx,ly,lx,ly)};
 cv.onpointermove=e=>{if(!on)return;const[x,y]=pt(e);seg(lx,ly,x,y);lx=x;ly=y};
 cv.onpointerup=cv.onpointercancel=()=>{on=false};
 paint();try{document.fonts.load('40px "EuroScript"').then(paint)}catch(e){}
 const T={won:false,clear(){ig.clearRect(0,0,W,H);paint()},check(){
  const gm=mk().getContext("2d"),tm=mk().getContext("2d");gm.fillStyle=tm.fillStyle=tm.strokeStyle="#000";draw(gm);draw(tm,true);
  const G=gm.getImageData(0,0,W,H).data,Tl=tm.getImageData(0,0,W,H).data,I=ig.getImageData(0,0,W,H).data;
  let gt=0,gh=0,it=0,ii=0;for(let i=3;i<G.length;i+=4){const ni=I[i]>100;if(G[i]>100){gt++;if(ni)gh++}if(ni){it++;if(Tl[i]>100)ii++}}
  const el=cv.parentNode.querySelector(".msg"),good=gt>0&&it>0&&gh/gt>.6&&ii/it>.75;
  el.style.color=good?"var(--ok)":"var(--bad)";el.textContent=good?"✓ Super!":"Fast! Folge dem grauen Buchstaben noch einmal.";
  if(good&&!T.won){T.won=true;S.total++;win();if(S.mode==="practice")setTimeout(()=>{if(S.mode==="practice"&&S.type==="trace")newQ()},1800)}
 }};
 TR.set(cv,T)})}

function renderLearn(){
  const k=key(S.letter),pair=k==="ß"?["ß"]:[k,k.toLowerCase()];
  const keys=UP.concat(["ß"]);
  app.innerHTML=`<div class="card">
    <div class="lbl">Tippe einen Buchstaben ein oder wähle unten einen aus</div>
    <div class="row"><input id="inp" onfocus="this.select()" value="${S.letter}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    <div class="tr"><canvas id="lc" width="800" height="480"></canvas></div>
    <div class="big" style="min-height:4.5rem;font-size:3rem">${pair.map(p=>`<div class="d">${p}</div>`).join("")}</div>
    <div class="row"><button data-sp="${k}">🔊</button></div><div class="grid">${keys.map(l=>`<button data-l="${l}" class="d ${l===k?"on":""}">${l==="ß"?"ß":l+l.toLowerCase()}</button>`).join("")}</div>
  </div>`;
  trInit();lineLearn(document.getElementById("lc"),pair);const inp=document.getElementById("inp");
  inp.addEventListener("input",()=>{const v=inp.value.slice(-1);if(UP.concat(LO).includes(v)){S.letter=v;renderLearn();const n=document.getElementById("inp");n.focus();n.select()}});
}

const ico=(k,v,html)=>`<button data-k="${k}" data-v="${v}" class="${S[k]===v?"on":""}">${html}</button>`;
function renderPanel(){
  if(S.mode==="trace"){panel.innerHTML=`<div class="prow"><span class="pi">👀</span>${ico("demo","1","👁️")}${ico("demo","h","◐")}${ico("demo","0","🙈")}</div><button class="go" id="go">✓</button>`;panel.classList.toggle("open",S.open);return}
  const w=["word","wmc","trace"].includes(S.type);
  panel.innerHTML=`<div class="prow"><span class="pi">🎯</span>${ico("type","mc","▢▢☑")}${ico("type","rec","A ⌨")}${ico("type","wmc","🐱 ▢☑")}${ico("type","word","🐱 ✍")}</div>
  ${w?"":`<div class="prow"><span class="pi">🔁</span>${ico("dir","d2s",'<span class="d">A</span> → <span class="s">A</span>')}${ico("dir","s2d",'<span class="s">A</span> → <span class="d">A</span>')}</div>
  <div class="prow"><span class="pi">🔤</span>${ico("cs","upper","ABC")}${ico("cs","lower","abc")}${ico("cs","all","AaBbCc")}</div>`}
  <button class="go" id="go">✓</button>`;
  panel.classList.toggle("open",S.open);
}

function newQ(){
  S.done=false;S.msg="";S.hint=false;
  if(S.type==="word"||S.type==="wmc"||S.type==="trace"){const w=pick(WORDS);S.q={w,opts:S.type==="wmc"?shuffle([w,...shuffle(WORDS.filter(x=>x!==w)).slice(0,3)]):[]}}
  else{
    const p=pool(),c=wpick(p);let opts=[];
    if(S.type==="mc"){
      const same=shuffle(p.filter(x=>x!==c&&isUp(x)===isUp(c))).slice(0,2);
      const rest=shuffle(p.filter(x=>x!==c&&!same.includes(x))).slice(0,3);
      opts=shuffle([c,...same,...rest]);
    }
    S.q={c,opts};
  }
  renderPractice();
}
function stats(){
  const pct=S.total?Math.round(S.right/S.total*100):0;
  return `<div class="stats"><span>🔥 ${S.streak}</span><span>🏆 ${S.best}</span><span>✅ ${S.right}/${S.total}</span><span>⭐ ${S.stars}</span></div>
  <div class="pbar"><i style="width:${pct}%"></i><b>${pct}%</b></div>`;
}
function renderPractice(){
  const q=S.q,d2s=S.dir==="d2s";let body="";
  if(S.type==="trace"){body=trHTML(q.w[0],900,300)+`<div class="row"><button data-sp="${q.w[0]}">🔊</button></div>`}
  else if(S.type==="wmc"){body=`<div class="q w s">${q.w[0]}</div><div class="opts" style="grid-template-columns:repeat(2,1fr)">${q.opts.map(o=>`<button data-a="${o[0]}" class="d" style="font-size:2rem" ${S.done?"disabled":""}>${o[0]}</button>`).join("")}</div><div class="row"><button data-sp="${q.w[0]}">🔊</button></div>`}
  else
  if(S.type==="word"){
    body=`<div class="q w s">${q.w[0]}</div>
    ${S.hint?`<div class="q" style="min-height:4rem;font-size:3.2rem">${q.w[1]}</div>`:""}
    <div class="row"><input id="ans" class="wide" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ${S.done?"disabled":""}><button id="chk" ${S.done?"disabled":""}>✓</button><button id="hint" ${S.done?"disabled":""}>💡</button><button data-sp="${q.w[0]}">🔊</button></div>`;
  }else{
    body=`<div class="q ${d2s?"d":"s"}">${q.c}</div>`;
    if(S.type==="mc")body+=`<div class="opts">${q.opts.map(o=>`<button data-a="${o}" class="${d2s?"s":"d"}" ${S.done?"disabled":""}>${o}</button>`).join("")}</div>`;
    else if(d2s){const dis=S.done?"disabled":"",bt=o=>`<button data-a="${o}" class="s ${o===o.toUpperCase()&&o!==o.toLowerCase()?"u":"l"}" ${dis}>${o}</button>`;body+=S.cs==="all"?`<div class="grid pg">${UP.map(u=>`<div class="pr">${bt(u)}${bt(u.toLowerCase())}</div>`).join("")}<div class="pr">${bt("ß")}</div></div>`:`<div class="grid">${pool().map(o=>bt(o)).join("")}</div>`}
    else body+=`<div class="row"><input id="ans" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ${S.done?"disabled":""}><button id="chk" ${S.done?"disabled":""}>✓</button></div>`;
  }
  body+=`<div class="msg" style="color:${S.msg.startsWith("✓")?"var(--ok)":"var(--bad)"}">${S.msg}</div>`;
  if(S.done&&!S.msg.startsWith("✓"))body+=`<div class="row"><button id="next" class="on">➜</button></div>`;
  app.innerHTML=`<div class="card">${body}${stats()}</div>`;
  const a=document.getElementById("ans");if(a&&!S.done)a.focus();trInit();
}
function answer(a){
  if(S.done)return;
  S.done=true;S.total++;
  const target=S.q.w?S.q.w[0]:S.q.c;
  const ok=S.q.w?a.trim().toLowerCase()===target.toLowerCase():a===target;
  if(ok){win();if(S.miss[target])S.miss[target]--;sv();S.msg="✓ Richtig!";
    if(S.streak>S.best){S.best=S.streak;try{localStorage.setItem("sb_best",S.best)}catch(e){}}
  }else{S.streak=0;S.miss[target]=(S.miss[target]||0)+1;sv();S.msg="✗ Richtig ist: "+target}
  renderPractice();
  document.querySelectorAll("[data-a]").forEach(b=>{if(b.dataset.a===target)b.classList.add("ok");else if(b.dataset.a===a)b.classList.add("bad")});
  if(ok)setTimeout(()=>{if(S.mode==="practice"&&S.done)newQ()},1800);
}
function setMode(m,btn){
  S.mode=m;S.open=false;
  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b===btn));
  burger.style.display=m==="learn"?"none":"";
  panel.classList.remove("open");
  if(m==="learn")renderLearn();else if(m==="trace"){S.streak=0;renderPanel();renderTrace()}else{S.right=0;S.total=0;S.streak=0;renderPanel();newQ()}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.mode)return setMode(t.dataset.mode,t);
  if(t.id==="burger"){S.open=!S.open;renderPanel();return}
  if(t.id==="go"){S.open=false;renderPanel();return}
  if(t.dataset.sp){speak(t.dataset.sp);return}
  if(t.dataset.tc){const T=TR.get(t.closest(".tr").querySelector("canvas"));t.dataset.tc==="clr"?T.clear():T.check();return}
  if(t.dataset.l){S.letter=t.dataset.l;S.mode==="trace"?renderTrace():renderLearn();return}
  if(t.dataset.tc2){if(TC)TC[t.dataset.tc2]();return}
  if(t.dataset.k){S[t.dataset.k]=t.dataset.v;if(S.mode==="trace"){renderPanel();renderTrace();return}S.right=0;S.total=0;S.streak=0;renderPanel();newQ();return}
  if(t.dataset.a!==undefined)return answer(t.dataset.a);
  if(t.id==="chk"){const v=document.getElementById("ans").value;if(v)answer(v);return}
  if(t.id==="hint"){S.hint=true;const v=document.getElementById("ans").value;renderPractice();document.getElementById("ans").value=v;return}
  if(t.id==="next")newQ();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||S.mode!=="practice")return;
  if(S.done){if(!S.msg.startsWith("✓"))newQ()}
  else{const a=document.getElementById("ans");if(a&&a.value)answer(a.value)}
});
renderLearn();
try{document.fonts.load('40px "EuroScript"','a').then(()=>{const ok=document.fonts.check('40px "EuroScript"','a');document.getElementById("fs").textContent=ok?"Schrift: EuroScript ✓":"Schrift: Ersatzschrift (EuroScript nicht geladen)"})}catch(e){}
</script>
</body>
</html>
